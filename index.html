<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Simon Says</h2>
    <h2 class="HS">Highest Score : 0</h2>
    <h2 class="instruction">press any key to start the game</h3>
    <div class="container">
        <div class="lo">
            <div class="box red" type="button" id="red" ></div>
            <div class="box yellow" id="yellow" type="button"></div>
        </div>
        <div class="lt">
            <div class="box purple"type="button" id="purple"></div>
            <div class="box green" type="button" id="green"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
